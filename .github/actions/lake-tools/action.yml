name: Lake toolchains
description: Install just, the Rust toolchain and uv for Lake's justfile.

runs:
  using: composite
  steps:
    - name: Install just
      uses: extractions/setup-just@v4
      with:
        just-version: ">=1.42.0"

    - name: Install the Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
        components: clippy,rustfmt
        rust-src-dir: runtime
        build-warnings: ""

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: "3.15"
        enable-cache: true
