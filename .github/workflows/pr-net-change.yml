name: PR Net Change

# pull_request_target rather than pull_request: half of this team's pull
# requests come from forks, and a fork's pull_request run gets a read-only
# token that cannot comment. pull_request_target runs with a write token, so
# it must never execute code from the pull request. It doesn't: the checkout
# is the base branch, and the head is only fetched as git objects to diff.
# The catch is that edits to this workflow or its script only take effect
# once they are on main.
on:
  pull_request_target:
    branches: main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-net-change-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute net change
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR/head"
          python3 .github/scripts/pr_net_change.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Edit the comment from the previous push rather than adding a new
          # one each time, found by the marker on its first line.
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq '.[] | select(.user.login == "github-actions[bot]")
                           | select(.body | startswith("<!-- pr-net-change -->"))
                           | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
