name: Lake Check

# See lake-build.yml for why each recipe is its own workflow, and
# .github/actions/lake-tools/action.yml for the pinned image and shared triggers.

on:
  push:
    branches: main
  pull_request:
    branches: main

# github.workflow keeps the three workflows from cancelling one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install the Lake toolchains
        uses: $/.github/actions/lake-tools
      # Non-mutating by design: fmt --check plus clippy and ruff without --fix,
      # so this reports formatting and lint findings instead of quietly rewriting
      # the tree it is judging. The autofixing just lint stays a dev-side command.
      - name: just check
        run: just check
