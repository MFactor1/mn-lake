name: Lake Test

on:
  push:
    branches: main
  pull_request:
    branches: main

# github.workflow keeps the three workflows from cancelling one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install the Lake toolchains
        uses: $/.github/actions/lake-tools
      - name: just test
        run: just test
