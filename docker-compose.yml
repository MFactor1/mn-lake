# Lake — distributed AI inference on local edge devices.
# Dev harness: runs the two Lake processes (Python coordinator + Rust runtime)
# side by side. The same workflow works for Linux, macOS, and Windows devs —
# from the repo root, run:
#
#   docker compose up      # build both images, run both processes
#   docker compose down    # stop both processes
#   docker compose build runtime  # force a Rust rebuild after source changes
#   docker compose exec coordinator sh   # drop into a container
#
# (or via the root justfile: just up / down / rebuild / build-runtime ...)
#
# Notes:
# - Both services share one compose network, so the coordinator can reach the
#   runtime process at host name "runtime" (and vice versa) once IPC exists.
# - Windows devs: keep these files LF-only (git core.autocrlf) so Docker and
#   the toolchains see clean line endings.
# - Python tooling (uv, CPython, the venv at /venv) lives entirely inside the
#   coordinator image; the ./coordinator bind mount is source-only, so devs
#   never need Python or uv on their host machine.

services:
  coordinator:
    build:
      context: ./coordinator
    volumes:
      # Dev convenience: edit Python files in ./coordinator and they are live
      # inside the container — remove this bind before any final deployment.
      - ./coordinator:/app
      - lake-models:/models
    ports:
      - "8000:8000" # Lake coordinator API (FastAPI)

  runtime:
    build:
      context: ./runtime
    # Rust changes land via rebuild (cached, so only changed crates recompile):
    #   docker compose build runtime
    volumes:
      - lake-models:/models
    ports:
      - "9100:9100" # runtime engine Tensor I/O socket (placeholder)

volumes:
  lake-models: # shared GGUF (.gguf) model files both processes can mmap
